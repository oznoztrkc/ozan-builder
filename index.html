<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ozan Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #111827;
    }

    header {
      height: 68px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
    }

    .logo span {
      color: #635bff;
    }

    .new-btn {
      border: none;
      background: #635bff;
      color: white;
      padding: 11px 17px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .new-btn:hover {
      background: #5148df;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 45px 20px;
    }

    .hero h1 {
      font-size: 36px;
      margin: 0 0 10px;
    }

    .hero p {
      margin: 0;
      color: #6b7280;
      line-height: 1.6;
    }

    .projects {
      margin-top: 35px;
    }

    .projects-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .projects-title h2 {
      margin: 0;
      font-size: 21px;
    }

    .empty {
      background: white;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      padding: 50px 20px;
      text-align: center;
      color: #6b7280;
    }

    .empty strong {
      display: block;
      color: #111827;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .project-list {
      display: grid;
      gap: 15px;
    }

    .project-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.04);
    }

    .project-info {
      min-width: 0;
    }

    .project-info h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .project-info p {
      margin: 0;
      color: #6b7280;
      line-height: 1.5;
      word-break: break-word;
    }

    .template {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 9px;
      background: #eef2ff;
      color: #4338ca;
      border-radius: 6px;
      font-size: 12px;
    }

    .project-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .open-btn {
      border: none;
      background: #111827;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }

    .open-btn:hover {
      background: #000;
    }

    .delete-btn {
      border: 1px solid #e5e7eb;
      background: white;
      color: #dc2626;
      padding: 11px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .delete-btn:hover {
      background: #fef2f2;
    }

    .loading {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      color: #6b7280;
    }

    @media (max-width: 700px) {

      header {
        padding: 0 15px;
      }

      .container {
        padding: 30px 15px;
      }

      .hero h1 {
        font-size: 29px;
      }

      .project-card {
        flex-direction: column;
        align-items: stretch;
      }

      .project-actions {
        width: 100%;
      }

      .open-btn,
      .delete-btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      Ozan <span>Builder</span>
    </div>

    <button
      class="new-btn"
      onclick="newProject()"
    >
      + Yeni Proje
    </button>

  </header>


  <main class="container">

    <section class="hero">

      <h1>
        Kendi web siteni oluştur.
      </h1>

      <p>
        Projeni oluştur, tasarla ve ilerleyen aşamalarda
        yapay zekâ ile geliştirmeye devam et.
      </p>

    </section>


    <section class="projects">

      <div class="projects-title">

        <h2>
          Projelerim
        </h2>

      </div>


      <div id="projectContainer">

        <div class="loading">
          Projeler yükleniyor...
        </div>

      </div>

    </section>

  </main>


  <!-- Proje yönetim sistemi -->
  <script src="js/projects.js"></script>

  <script>

    function newProject() {

      window.location.href = "editor.html";

    }


    function openProject(id) {

      localStorage.setItem(
        "ozan_builder_current_project",
        id
      );

      window.location.href = "editor.html";

    }


    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function getTemplateName(template) {

      var names = {

        blank: "Boş Proje",

        business: "Kurumsal",

        portfolio: "Portföy",

        blog: "Blog"

      };

      return names[template] || "Boş Proje";

    }


    function deleteProject(id) {

      var confirmed =
        confirm(
          "Bu projeyi silmek istediğine emin misin?"
        );

      if (!confirmed) {
        return;
      }

      ProjectManager.deleteProject(id);

      showProjects();

    }


    function showProjects() {

      var container =
        document.getElementById(
          "projectContainer"
        );


      var projects =
        ProjectManager.getProjects();


      if (!projects || projects.length === 0) {

        container.innerHTML = `

          <div class="empty">

            <strong>
              Henüz projen yok.
            </strong>

            Yeni bir proje oluşturarak başlayabilirsin.

          </div>

        `;

        return;

      }


      container.innerHTML = `

        <div class="project-list">

          ${projects.map(function(project) {

            return `

              <div class="project-card">

                <div class="project-info">

                  <h3>
                    ${escapeHTML(project.name)}
                  </h3>

                  <p>
                    ${
                      escapeHTML(
                        project.description ||
                        "Açıklama bulunmuyor."
                      )
                    }
                  </p>

                  <span class="template">

                    Şablon:
                    ${
                      escapeHTML(
                        getTemplateName(
                          project.template
                        )
                      )
                    }

                  </span>

                </div>


                <div class="project-actions">

                  <button
                    class="open-btn"
                    onclick="openProject('${project.id}')"
                  >
                    Aç
                  </button>

                  <button
                    class="delete-btn"
                    onclick="deleteProject('${project.id}')"
                  >
                    Sil
                  </button>

                </div>

              </div>

            `;

          }).join("")}

        </div>

      `;

    }


    // Sayfa açıldığında projeleri getir
    showProjects();

  </script>

</body>
</html>
