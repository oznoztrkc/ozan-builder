<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ozan Builder</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f5fa;color:#18151f}
header{height:70px;background:#fff;border-bottom:1px solid #e5e2eb;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.logo{font-size:22px;font-weight:800}.logo span{color:#6d28d9}
.container{max-width:1100px;margin:45px auto;padding:0 20px}
.hero{background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;border-radius:22px;padding:42px;margin-bottom:35px}
.hero h1{margin:0 0 10px;font-size:38px}.hero p{margin:0;opacity:.9}
.button{border:0;background:#6d28d9;color:white;padding:12px 18px;border-radius:9px;cursor:pointer;font-weight:600}
.form{display:none;background:white;padding:28px;border-radius:18px;border:1px solid #e5e2eb;margin-bottom:35px}
input,textarea,select{width:100%;padding:13px;margin:8px 0 18px;border:1px solid #d9d5e2;border-radius:9px;font-size:15px}
textarea{min-height:100px;resize:vertical}
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
.project{background:white;border:1px solid #e5e2eb;border-radius:16px;padding:22px;cursor:pointer;transition:.2s}
.project:hover{transform:translateY(-3px);box-shadow:0 8px 25px #0001}
.project h3{margin-top:0}.project small{color:#777}
.empty{text-align:center;padding:35px;background:#fff;border-radius:16px;border:1px dashed #ccc;color:#777}
</style>
</head>

<body>

<header>
<div class="logo">Ozan <span>Builder</span></div>
<button class="button" onclick="toggleForm()">+ Yeni Proje</button>
</header>

<main class="container">

<section class="hero">
<h1>Kendi web siteni oluştur.</h1>
<p>Projeni oluştur, tasarla ve yapay zekâ ile geliştirmeye devam et.</p>
</section>

<section class="form" id="form">

<h2>Yeni Proje Oluştur</h2>

<label>Proje adı</label>
<input id="name" placeholder="Örn: Digiturk İnternet Bilgi Portalı">

<label>Açıklama</label>
<textarea id="description" placeholder="Projen ne yapacak?"></textarea>

<label>Başlangıç şablonu</label>
<select id="template">
<option value="blank">Boş Proje</option>
<option value="corporate">Kurumsal Site</option>
<option value="portal">Bilgi Portalı</option>
<option value="landing">Tanıtım Sayfası</option>
</select>

<button class="button" onclick="createProject()">Projeyi Oluştur</button>

</section>

<h2>Projelerim</h2>

<div id="projects" class="projects"></div>

</main>

<script>

function toggleForm(){
const f=document.getElementById("form");
f.style.display=f.style.display==="block"?"none":"block";
}

function createProject(){

const name=document.getElementById("name").value.trim();
const description=document.getElementById("description").value.trim();
const template=document.getElementById("template").value;

if(!name){
alert("Lütfen proje adını gir.");
return;
}

const projects=JSON.parse(
localStorage.getItem("ozan_projects")||"[]"
);

const project={
id:Date.now(),
name,
description,
template,
createdAt:new Date().toLocaleString("tr-TR")
};

projects.push(project);

localStorage.setItem(
"ozan_projects",
JSON.stringify(projects)
);

document
