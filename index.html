<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozan Builder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    header {
      height: 64px;
      background: #171717;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .logo span {
      color: #8b5cf6;
    }

    .status {
      font-size: 13px;
      color: #aaa;
    }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      height: calc(100vh - 64px);
    }

    .sidebar,
    .rightbar {
      background: white;
      border-right: 1px solid #ddd;
      padding: 20px;
      overflow-y: auto;
    }

    .rightbar {
      border-right: none;
      border-left: 1px solid #ddd;
    }

    .workspace {
      padding: 24px;
      overflow: auto;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 16px;
    }

    .section {
      margin-bottom: 24px;
    }

    .button {
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 8px;
      background: #f1f1f1;
      margin-bottom: 8px;
      cursor: pointer;
      text-align: left;
    }

    .button:hover {
      background: #e7e7e7;
    }

    .primary {
      background: #7c3aed;
      color: white;
      text-align: center;
      font-weight: bold;
    }

    .primary:hover {
      background: #6d28d9;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      resize: vertical;
      font-family: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: #7c3aed;
    }

    .preview {
      min-height: 600px;
      background: white;
      border-radius: 12px;
      border: 1px solid #ddd;
      box-shadow: 0 4px 20px rgba(0,0,0,.05);
      overflow: hidden;
    }

    .preview-header {
      height: 55px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-weight: bold;
    }

    .preview-content {
      padding: 40px;
    }

    .preview-content h1 {
      font-size: 40px;
      margin-bottom: 16px;
    }

    .preview-content p {
      color: #666;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 80px 20px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #7c3aed;
    }

    .mobile-preview {
      max-width: 390px;
      margin: auto;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 220px 1fr;
      }

      .rightbar {
        display: none;
      }
    }

    @media (max-width: 650px) {
      .app {
        display: block;
      }

      .sidebar {
        display: none;
      }

      .workspace {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Ozan <span>Builder</span></div>
  <div class="status">Ücretsiz Web Site Builder</div>
</header>

<div class="app">

  <aside class="sidebar">

    <div class="section">
      <h2>Sayfa</h2>

      <button class="button" onclick="newPage()">
        + Yeni Sayfa
      </button>

      <button class="button" onclick="selectPage('Ana Sayfa')">
        🏠 Ana Sayfa
      </button>

      <button class="button" onclick="selectPage('Hakkımızda')">
        📄 Hakkımızda
      </button>

      <button class="button" onclick="selectPage('İletişim')">
        📞 İletişim
      </button>
    </div>

    <div class="section">
      <h2>Bileşenler</h2>

      <button class="button" onclick="addComponent('Başlık')">
        T Başlık
      </button>

      <button class="button" onclick="addComponent('Metin')">
        📝 Metin
      </button>

      <button class="button" onclick="addComponent('Buton')">
        🔘 Buton
      </button>

      <button class="button" onclick="addComponent('Görsel')">
        🖼 Görsel
      </button>

      <button class="button" onclick="addComponent('Kart')">
        🗂 Kart
      </button>
    </div>

  </aside>

  <main class="workspace">

    <div class="preview">

      <div class="preview-header">
        <span id="pageName">Ana Sayfa</span>
      </div>

      <div id="previewContent" class="preview-content">

        <h1>Web siteni oluşturmaya başla</h1>

        <p>
          Sol taraftaki bileşenleri kullanabilir veya sağ taraftaki
          ayarlardan sitenin içeriğini değiştirebilirsin.
        </p>

      </div>

    </div>

  </main>

  <aside class="rightbar">

    <div class="section">

      <h2>Sayfa Ayarları</h2>

      <div class="field">
        <label>Site Başlığı</label>

        <input
          id="siteTitle"
          type="text"
          value="Yeni Web Sitem"
          oninput="updateSite()"
        >
      </div>

      <div class="field">
        <label>Başlık</label>

        <input
          id="mainTitle"
          type="text"
          value="Web siteni oluşturmaya başla"
          oninput="updateSite()"
        >
      </div>

      <div class="field">

        <label>Açıklama</label>

        <textarea
          id="description"
          oninput="updateSite()"
        >Sol taraftaki bileşenleri kullanarak web siteni oluştur.</textarea>

      </div>

      <button class="button primary" onclick="saveSite()">
        💾 Kaydet
      </button>

      <button class="button" onclick="previewSite()">
        👁 Önizleme
      </button>

    </div>

    <div class="section">

      <h2>AI Komutu</h2>

      <textarea
        id="aiCommand"
        placeholder="Örn: Mor ve beyaz renklerde modern bir internet sitesi oluştur..."
      ></textarea>

      <button class="button primary" onclick="runAICommand()">
        ✨ Komutu Uygula
      </button>

    </div>

  </aside>

</div>

<script>

let pages = {
  "Ana Sayfa": {
    title: "Web siteni oluşturmaya başla",
    description: "Sol taraftaki bileşenleri kullanarak web siteni oluştur."
  },

  "Hakkımızda": {
    title: "Hakkımızda",
    description: "Bu alanı daha sonra düzenleyebilirsin."
  },

  "İletişim": {
    title: "İletişim",
    description: "İletişim bilgilerini buraya ekleyebilirsin."
  }
};

let currentPage = "Ana Sayfa";

function selectPage(page) {

  currentPage = page;

  document.getElementById("pageName").innerText = page;

  document.getElementById("mainTitle").value =
    pages[page].title;

  document.getElementById("description").value =
    pages[page].description;

  updateSite();
}

function updateSite() {

  const title =
    document.getElementById("mainTitle").value;

  const description =
    document.getElementById("description").value;

  pages[currentPage] = {
    title: title,
    description: description
  };

  document.getElementById("previewContent").innerHTML = `
    <h1>${escapeHTML(title)}</h1>
    <p>${escapeHTML(description)}</p>
  `;
}

function newPage() {

  const name =
    prompt("Yeni sayfanın adı:");

  if (!name) return;

  pages[name] = {
    title: name,
    description: "Bu sayfanın içeriğini düzenleyebilirsin."
  };

  selectPage(name);
}

function addComponent(type) {

  const container =
    document.getElementById("previewContent");

  if (type === "Başlık") {

    container.innerHTML +=
      "<h2>Yeni Başlık</h2>";

  }

  if (type === "Metin") {

    container.innerHTML +=
      "<p>Yeni metin alanı.</p>";

  }

  if (type === "Buton") {

    container.innerHTML +=
      '<button class="button primary">Yeni Buton</button>';

  }

  if (type === "Görsel") {

    container.innerHTML +=
      "<p>🖼 Görsel alanı</p>";

  }

  if (type === "Kart") {

    container.innerHTML += `
      <div style="
        padding:20px;
        border:1px solid #ddd;
        border-radius:12px;
        margin-top:20px;
      ">
        <h3>Yeni Kart</h3>
        <p>Kart açıklaması.</p>
      </div>
    `;

  }
}

function saveSite() {

  localStorage.setItem(
    "ozan-builder-pages",
    JSON.stringify(pages)
  );

  alert("Site tarayıcıya kaydedildi.");
}

function previewSite() {

  alert(
    "Önizleme modu sonraki aşamada ayrı bir sayfa olarak geliştirilecek."
  );
}

function runAICommand() {

  const command =
    document.getElementById("aiCommand").value.trim();

  if (!command) {

    alert("Önce bir komut yaz.");

    return;
  }

  alert(
    "AI motoru henüz bağlanmadı.\n\nKomutun alındı:\n" +
    command +
    "\n\nSonraki aşamada gerçek AI bağlantısını ekleyeceğiz."
  );
}

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
