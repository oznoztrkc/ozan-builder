<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozan Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    header {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #6c35de;
    }

    .top-buttons {
      display: flex;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .primary {
      background: #6c35de;
      color: white;
    }

    .secondary {
      background: #eee;
      color: #333;
    }

    main {
      display: flex;
      min-height: calc(100vh - 64px);
    }

    aside {
      width: 250px;
      background: white;
      border-right: 1px solid #ddd;
      padding: 20px;
    }

    aside h3 {
      margin-top: 0;
    }

    .tool {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: #fafafa;
      cursor: pointer;
      text-align: left;
    }

    .tool:hover {
      background: #f0ebff;
      border-color: #6c35de;
    }

    .canvas-area {
      flex: 1;
      padding: 25px;
    }

    .canvas-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .preview {
      min-height: 600px;
      background: white;
      border: 2px dashed #bbb;
      border-radius: 12px;
      padding: 30px;
    }

    .empty {
      text-align: center;
      padding-top: 180px;
      color: #777;
    }

    .empty h2 {
      color: #333;
    }

    .builder-element {
      margin: 15px 0;
      padding: 10px;
      border: 1px dashed transparent;
    }

    .builder-element:hover {
      border-color: #6c35de;
    }

    @media (max-width: 700px) {
      main {
        flex-direction: column;
      }

      aside {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid #ddd;
      }

      .tool {
        display: inline-block;
        width: auto;
        margin-right: 5px;
      }

      .canvas-area {
        padding: 15px;
      }

      .preview {
        min-height: 500px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🚀 Ozan Builder</div>

  <div class="top-buttons">
    <button class="secondary" onclick="clearCanvas()">
      Temizle
    </button>

    <button class="primary" onclick="saveProject()">
      Kaydet
    </button>
  </div>
</header>

<main>

  <aside>
    <h3>Elementler</h3>

    <div class="tool" onclick="addTitle()">
      🔤 Başlık ekle
    </div>

    <div class="tool" onclick="addText()">
      📝 Metin ekle
    </div>

    <div class="tool" onclick="addButton()">
      🔘 Buton ekle
    </div>

    <div class="tool" onclick="addSection()">
      📦 Bölüm ekle
    </div>
  </aside>

  <section class="canvas-area">

    <div class="canvas-header">
      <h2>Site Önizleme</h2>
      <span id="status">Hazır</span>
    </div>

    <div class="preview" id="preview">

      <div class="empty" id="emptyState">
        <h2>Web siteni burada oluştur</h2>
        <p>
          Soldaki elementlerden birini seçerek başla.
        </p>
      </div>

    </div>

  </section>

</main>

<script>

let elementCount = 0;

function removeEmpty() {
  const empty = document.getElementById("emptyState");

  if (empty) {
    empty.remove();
  }
}

function createElement(content) {

  removeEmpty();

  elementCount++;

  const element = document.createElement("div");

  element.className = "builder-element";

  element.innerHTML = content;

  element.dataset.id = elementCount;

  document
    .getElementById("preview")
    .appendChild(element);

  document.getElementById("status").innerText =
    elementCount + " element";
}

function addTitle() {

  createElement(`
    <h1 contenteditable="true">
      Yeni Başlık
    </h1>
  `);
}

function addText() {

  createElement(`
    <p contenteditable="true">
      Buraya metin yazabilirsin.
    </p>
  `);
}

function addButton() {

  createElement(`
    <button class="primary">
      Yeni Buton
    </button>
  `);
}

function addSection() {

  createElement(`
    <section style="
      padding:30px;
      background:#f5f0ff;
      border-radius:12px;
    ">
      <h2 contenteditable="true">
        Yeni Bölüm
      </h2>

      <p contenteditable="true">
        Bölüm içeriğini buraya yaz.
      </p>
    </section>
  `);
}

function clearCanvas() {

  document.getElementById("preview").innerHTML = `
    <div class="empty" id="emptyState">
      <h2>Web siteni burada oluştur</h2>
      <p>
        Soldaki elementlerden birini seçerek başla.
      </p>
    </div>
  `;

  elementCount = 0;

  document.getElementById("status").innerText =
    "Hazır";
}

function saveProject() {

  const content =
    document.getElementById("preview").innerHTML;

  localStorage.setItem(
    "ozan-builder-project",
    content
  );

  document.getElementById("status").innerText =
    "Kaydedildi ✓";
}

window.onload = function() {

  const saved =
    localStorage.getItem(
      "ozan-builder-project"
    );

  if (saved) {

    document.getElementById("preview").innerHTML =
      saved;

    document.getElementById("status").innerText =
      "Kayıtlı proje";

  }

};

</script>

</body>
</html>
