<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozan Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f5fa;
      color: #17151f;
    }

    header {
      height: 70px;
      background: #ffffff;
      border-bottom: 1px solid #e5e2eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
    }

    .logo span {
      color: #6d28d9;
    }

    .container {
      max-width: 1100px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .hero {
      background: linear-gradient(135deg, #6d28d9, #8b5cf6);
      color: white;
      border-radius: 22px;
      padding: 45px;
      margin-bottom: 35px;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    .hero p {
      margin: 0;
      opacity: .9;
      font-size: 17px;
    }

    .button {
      border: 0;
      background: #6d28d9;
      color: white;
      padding: 13px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    .button:hover {
      opacity: .9;
    }

    .new-project {
      background: white;
      padding: 30px;
      border-radius: 18px;
      border: 1px solid #e5e2eb;
      margin-bottom: 35px;
    }

    .new-project h2 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin: 8px 0 18px;
      border: 1px solid #d9d5e2;
      border-radius: 9px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .project {
      background: white;
      border: 1px solid #e5e2eb;
      border-radius: 16px;
      padding: 22px;
    }

    .project h3 {
      margin-top: 0;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #777;
      background: white;
      border-radius: 16px;
      border: 1px dashed #ccc;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 15px;
      }

      .container {
        margin: 25px auto;
      }

      .hero {
        padding: 30px 22px;
      }

      .hero h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Ozan <span>Builder</span></div>
  <button class="button" onclick="showForm()">+ Yeni Proje</button>
</header>

<main class="container">

  <section class="hero">
    <h1>Kendi web siteni oluştur.</h1>
    <p>
      Projeni oluştur, tasarla ve ilerleyen aşamalarda
      yapay zekâ ile geliştirmeye devam et.
    </p>
  </section>

  <section class="new-project" id="projectForm" style="display:none;">

    <h2>Yeni Proje Oluştur</h2>

    <label>Proje adı</label>
    <input
      id="projectName"
      type="text"
      placeholder="Örn: Digiturk İnternet Bilgi Portalı"
    >

    <label>Açıklama</label>
    <textarea
      id="projectDescription"
      placeholder="Projen ne yapacak?"
    ></textarea>

    <label>Başlangıç şablonu</label>

    <select id="projectTemplate">
      <option value="blank">Boş Proje</option>
      <option value="corporate">Kurumsal Site</option>
      <option value="portal">Bilgi Portalı</option>
      <option value="landing">Tanıtım Sayfası</option>
    </select>

    <button class="button" onclick="createProject()">
      Projeyi Oluştur
    </button>

  </section>

  <section>

    <h2>Projelerim</h2>

    <div id="projects" class="projects">

      <div class="empty">
        Henüz oluşturulmuş bir proje yok.
        <br><br>
        İlk projenizi oluşturmak için
        <strong>Yeni Proje</strong> butonuna basın.
      </div>

    </div>

  </section>

</main>

<script>

function showForm() {
  const form = document.getElementById("projectForm");

  if (form.style.display === "none") {
    form.style.display = "block";
    form.scrollIntoView({ behavior: "smooth" });
  } else {
    form.style.display = "none";
  }
}

function createProject() {

  const name = document.getElementById("projectName").value.trim();
  const description = document.getElementById("projectDescription").value.trim();
  const template = document.getElementById("projectTemplate").value;

  if (!name) {
    alert("Lütfen proje adını gir.");
    return;
  }

  const project = {
    id: Date.now(),
    name: name,
    description: description,
    template: template,
    createdAt: new Date().toLocaleString("tr-TR")
  };

  const projects =
    JSON.parse(localStorage.getItem("ozan_projects") || "[]");

  projects.push(project);

  localStorage.setItem(
    "ozan_projects",
    JSON.stringify(projects)
  );

  renderProjects();

  document.getElementById("projectName").value = "";
  document.getElementById("projectDescription").value = "";

  document.getElementById("projectForm").style.display = "none";
}

function renderProjects() {

  const container = document.getElementById("projects");

  const projects =
    JSON.parse(localStorage.getItem("ozan_projects") || "[]");

  if (projects.length === 0) {
    container.innerHTML = `
      <div class="empty">
        Henüz oluşturulmuş bir proje yok.
      </div>
    `;
    return;
  }

  container.innerHTML = projects.map(project => `

    <div class="project">

      <h3>${escapeHtml(project.name)}</h3>

      <p>
        ${escapeHtml(
          project.description || "Açıklama eklenmemiş."
        )}
      </p>

      <small>
        Şablon: ${escapeHtml(project.template)}
      </small>

      <br><br>

      <small>
        Oluşturulma: ${escapeHtml(project.createdAt)}
      </small>

    </div>

  `).join("");
}

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

renderProjects();

</script>

</body>
</html>
