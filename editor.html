<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ozan Builder - Editör</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #111827;
    }

    header {
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
    }

    .logo span {
      color: #635bff;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .back {
      background: #eef0f4;
      color: #111827;
    }

    .save {
      background: #635bff;
      color: white;
    }

    .layout {
      display: grid;
      grid-template-columns: 230px 1fr 280px;
      min-height: calc(100vh - 64px);
    }

    .sidebar,
    .settings {
      background: white;
      padding: 20px;
    }

    .sidebar {
      border-right: 1px solid #e5e7eb;
    }

    .settings {
      border-left: 1px solid #e5e7eb;
    }

    .sidebar h3,
    .settings h3 {
      margin: 0 0 18px;
    }

    .tool {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      margin-bottom: 10px;
      text-align: left;
      padding: 13px;
      border-radius: 9px;
      cursor: pointer;
    }

    .tool:hover {
      background: #eef2ff;
      border-color: #c7d2fe;
    }

    .workspace {
      padding: 25px;
      overflow: auto;
    }

    .project-title {
      margin-bottom: 18px;
    }

    .project-title h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .project-title p {
      margin: 0;
      color: #6b7280;
    }

    .canvas {
      max-width: 1000px;
      min-height: 600px;
      margin: auto;
      background: white;
      border: 1px solid #dfe3e8;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.05);
      padding: 40px;
    }

    .canvas-empty {
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #d1d5db;
      border-radius: 10px;
      color: #9ca3af;
      text-align: center;
    }

    .element {
      position: relative;
      padding: 15px;
      margin-bottom: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      border-radius: 8px;
    }

    .element:hover {
      border-color: #c7d2fe;
    }

    .element.selected {
      border-color: #635bff;
      background: #fafaff;
    }

    .element h1 {
      font-size: 38px;
      margin: 0 0 10px;
    }

    .element p {
      color: #6b7280;
      line-height: 1.6;
      font-size: 17px;
    }

    .element img {
      max-width: 100%;
      border-radius: 10px;
    }

    .element button {
      background: #635bff;
      color: white;
    }

    .empty-message {
      text-align: center;
      color: #9ca3af;
    }

    .settings-empty {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 14px;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .update-btn {
      width: 100%;
      background: #111827;
      color: white;
      margin-top: 5px;
    }

    .delete-btn {
      width: 100%;
      background: #fee2e2;
      color: #b91c1c;
      margin-top: 10px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .check-row input {
      width: auto;
    }

    @media (max-width: 1000px) {

      .layout {
        grid-template-columns: 200px 1fr;
      }

      .settings {
        display: none;
      }

    }

    @media (max-width: 700px) {

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid #e5e7eb;
      }

      .workspace {
        padding: 15px;
      }

      .canvas {
        padding: 20px;
      }

    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    Ozan <span>Builder</span>
  </div>

  <div class="header-actions">

    <button
      class="back"
      onclick="goHome()"
    >
      ← Projeler
    </button>

    <button
      class="save"
      onclick="saveSite()"
    >
      Kaydet
    </button>

  </div>

</header>


<div class="layout">

  <!-- SOL PANEL -->

  <aside class="sidebar">

    <h3>Elemanlar</h3>

    <button
      class="tool"
      onclick="addHeading()"
    >
      ➕ Başlık ekle
    </button>

    <button
      class="tool"
      onclick="addText()"
    >
      📝 Metin ekle
    </button>

    <button
      class="tool"
      onclick="addImage()"
    >
      🖼️ Görsel ekle
    </button>

    <button
      class="tool"
      onclick="addButton()"
    >
      🔘 Buton ekle
    </button>

  </aside>


  <!-- ORTA ALAN -->

  <main class="workspace">

    <div class="project-title">

      <h1 id="projectName">
        Proje
      </h1>

      <p id="projectDescription">
        Web siteni burada tasarlayabilirsin.
      </p>

    </div>


    <div class="canvas">

      <div
        id="canvasContent"
        class="canvas-empty"
      >

        <div>

          <h2>
            Web siteni oluşturmaya başla
          </h2>

          <p>
            Soldaki araçlardan bir eleman ekle.
          </p>

        </div>

      </div>

    </div>

  </main>


  <!-- SAĞ PANEL -->

  <aside class="settings">

    <h3>Eleman Düzenle</h3>

    <div
      id="settingsContent"
      class="settings-empty"
    >
      Düzenlemek için ortadaki alandan
      bir elemana tıkla.
    </div>

  </aside>

</div>


<script src="js/projects.js"></script>

<script>

  let currentProject = null;

  let selectedElement = null;

  const canvas =
    document.getElementById("canvasContent");

  const settings =
    document.getElementById("settingsContent");


  // --------------------------------------------------
  // PROJEYİ YÜKLE
  // --------------------------------------------------

  function loadProject() {

    currentProject =
      ProjectManager.getCurrentProject();


    if (!currentProject) {

      document.getElementById(
        "projectName"
      ).textContent =
        "Proje bulunamadı";

      return;

    }


    document.getElementById(
      "projectName"
    ).textContent =
      currentProject.name;


    document.getElementById(
      "projectDescription"
    ).textContent =
      currentProject.description ||
      "Web siteni burada tasarlayabilirsin.";


    if (
      currentProject.elements &&
      currentProject.elements.length > 0
    ) {

      canvas.className = "";

      canvas.innerHTML = "";


      currentProject.elements.forEach(
        function(element) {

          renderElement(element);

        }
      );

    }

  }


  // --------------------------------------------------
  // ELEMAN EKLE
  // --------------------------------------------------

  function addElement(type, content) {

    if (!currentProject) {

      alert("Aktif proje bulunamadı.");

      return;

    }


    if (!currentProject.elements) {

      currentProject.elements = [];

    }


    const element = {

      id:
        Date.now().toString(),

      type:
        type,

      content:
        content,

      fontSize:
        type === "heading"
          ? 38
          : 17,

      align:
        "left",

      bold:
        false

    };


    currentProject.elements.push(
      element
    );


    canvas.className = "";

    renderElement(element);

    selectElement(element);

  }


  // --------------------------------------------------
  // ELEMANI EKRANA BAS
  // --------------------------------------------------

  function renderElement(element) {

    const wrapper =
      document.createElement("div");


    wrapper.className =
      "element";


    wrapper.dataset.id =
      element.id;


    if (element.type === "heading") {

      wrapper.innerHTML =
        "<h1>" +
        escapeHTML(element.content) +
        "</h1>";

    }


    if (element.type === "text") {

      wrapper.innerHTML =
        "<p>" +
        escapeHTML(element.content) +
        "</p>";

    }


    if (element.type === "image") {

      wrapper.innerHTML =
        "<img src=\"" +
        escapeHTML(element.content) +
        "\" alt=\"Görsel\">";

    }


    if (element.type === "button") {

      wrapper.innerHTML =
        "<button>" +
        escapeHTML(element.content) +
        "</button>";

    }


    applyStyle(
      wrapper,
      element
    );


    wrapper.onclick =
      function(event) {

        event.stopPropagation();

        selectElement(element);

      };


    canvas.appendChild(wrapper);

  }


  // --------------------------------------------------
  // ELEMAN SEÇ
  // --------------------------------------------------

  function selectElement(element) {

    selectedElement =
      element;


    document
      .querySelectorAll(".element")
      .forEach(function(item) {

        item.classList.remove(
          "selected"
        );

      });


    const domElement =
      document.querySelector(
        '[data-id="' +
        element.id +
        '"]'
      );


    if (domElement) {

      domElement.classList.add(
        "selected"
      );

    }


    showSettings(element);

  }


  // --------------------------------------------------
  // SAĞ PANEL
  // --------------------------------------------------

  function showSettings(element) {

    let html = "";


    html +=
      '<div class="field">';

    html +=
      '<label>İçerik</label>';


    if (element.type === "image") {

      html +=
        '<input id="editContent" value="' +
        escapeAttribute(element.content) +
        '" placeholder="Görsel URL">';

    } else {

      html +=
        '<textarea id="editContent">' +
        escapeHTML(element.content) +
        '</textarea>';

    }


    html +=
      '</div>';


    if (
      element.type === "heading" ||
      element.type === "text"
    ) {

      html +=
        '<div class="field">';

      html +=
        '<label>Yazı boyutu</label>';

      html +=
        '<input id="editFontSize" type="number" value="' +
        (element.fontSize || 17) +
        '">';

      html +=
        '</div>';


      html +=
        '<div class="field">';

      html +=
        '<label>Hizalama</label>';

      html +=
        '<select id="editAlign">';

      html +=
        '<option value="left">Sol</option>';

      html +=
        '<option value="center">Orta</option>';

      html +=
        '<option value="right">Sağ</option>';

      html +=
        '</select>';

      html +=
        '</div>';


      html +=
        '<div class="field check-row">';

      html +=
        '<input id="editBold" type="checkbox">';

      html +=
        '<label for="editBold">Kalın yazı</label>';

      html +=
        '</div>';

    }


    html +=
      '<button class="update-btn" onclick="updateSelected()">';

    html +=
      '✓ Güncelle';

    html +=
      '</button>';


    html +=
      '<button class="delete-btn" onclick="deleteSelected()">';

    html +=
      '🗑 Elemanı Sil';

    html +=
      '</button>';


    settings.innerHTML =
      html;


    const align =
      document.getElementById(
        "editAlign"
      );


    if (align) {

      align.value =
        element.align || "left";

    }


    const bold =
      document.getElementById(
        "editBold"
      );


    if (bold) {

      bold.checked =
        element.bold || false;

    }

  }


  // --------------------------------------------------
  // SEÇİLİ ELEMANI GÜNCELLE
  // --------------------------------------------------

  function updateSelected() {

    if (!selectedElement) {

      return;

    }


    const content =
      document.getElementById(
        "editContent"
      );


    if (content) {

      selectedElement.content =
        content.value;

    }


    const fontSize =
      document.getElementById(
        "editFontSize"
      );


    if (fontSize) {

      selectedElement.fontSize =
        Number(fontSize.value) || 17;

    }


    const align =
      document.getElementById(
        "editAlign"
      );


    if (align) {

      selectedElement.align =
        align.value;

    }


    const bold =
      document.getElementById(
        "editBold"
      );


    if (bold) {

      selectedElement.bold =
        bold.checked;

    }


    redraw();

    selectElement(
      selectedElement
    );

  }


  // --------------------------------------------------
  // ELEMANI SİL
  // --------------------------------------------------

  function deleteSelected() {

    if (!selectedElement) {

      return;

    }


    const confirmed =
      confirm(
        "Bu elemanı silmek istediğine emin misin?"
      );


    if (!confirmed) {

      return;

    }


    currentProject.elements =
      currentProject.elements.filter(
        function(element) {

          return (
            element.id !==
            selectedElement.id
          );

        }
      );


    selectedElement =
      null;


    redraw();


    settings.innerHTML =
      '<div class="settings-empty">' +
      'Düzenlemek için ortadaki alandan ' +
      'bir elemana tıkla.' +
      '</div>';

  }


  // --------------------------------------------------
  // CANVAS YENİLE
  // --------------------------------------------------

  function redraw() {

    canvas.className = "";

    canvas.innerHTML = "";


    if (
      !currentProject.elements ||
      currentProject.elements.length === 0
    ) {

      canvas.className =
        "canvas-empty";


      canvas.innerHTML =
        "<div>" +
        "<h2>Web siteni oluşturmaya başla</h2>" +
        "<p>Soldaki araçlardan bir eleman ekle.</p>" +
        "</div>";

      return;

    }


    currentProject.elements.forEach(
      function(element) {

        renderElement(element);

      }
    );

  }


  // --------------------------------------------------
  // STİLLER
  // --------------------------------------------------

  function applyStyle(
    wrapper,
    element
  ) {

    wrapper.style.textAlign =
      element.align || "left";


    if (
      element.type === "heading" ||
      element.type === "text"
    ) {

      const child =
        wrapper.firstElementChild;


      if (child) {

        child.style.fontSize =
          (element.fontSize || 17) +
          "px";


        child.style.fontWeight =
          element.bold
            ? "700"
            : "400";

      }

    }

  }


  // --------------------------------------------------
  // BAŞLIK
  // --------------------------------------------------

  function addHeading() {

    const text =
      prompt(
        "Başlık ne olsun?"
      );


    if (!text) {

      return;

    }


    addElement(
      "heading",
      text
    );

  }


  // --------------------------------------------------
  // METİN
  // --------------------------------------------------

  function addText() {

    const text =
      prompt(
        "Metin ne olsun?"
      );


    if (!text) {

      return;

    }


    addElement(
      "text",
      text
    );

  }


  // --------------------------------------------------
  // GÖRSEL
  // --------------------------------------------------

  function addImage() {

    const url =
      prompt(
        "Görsel URL'sini gir:"
      );


    if (!url) {

      return;

    }


    addElement(
      "image",
      url
    );

  }


  // --------------------------------------------------
  // BUTON
  // --------------------------------------------------

  function addButton() {

    const text =
      prompt(
        "Buton üzerinde ne yazsın?"
      );


    if (!text) {

      return;

    }


    addElement(
      "button",
      text
    );

  }


  // --------------------------------------------------
  // KAYDET
  // --------------------------------------------------

  function saveSite() {

    if (!currentProject) {

      alert(
        "Aktif proje bulunamadı."
      );

      return;

    }


    const result =
      ProjectManager.updateProject(
        currentProject
      );


    if (result) {

      alert(
        "✓ Proje başarıyla kaydedildi."
      );

    } else {

      alert(
        "Proje kaydedilemedi."
      );

    }

  }


  // --------------------------------------------------
  // ANA SAYFA
  // --------------------------------------------------

  function goHome() {

    if (currentProject) {

      ProjectManager.updateProject(
        currentProject
      );

    }


    window.location.href =
      "index.html";

  }


  // --------------------------------------------------
  // GÜVENLİ HTML
  // --------------------------------------------------

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHTML(value);

  }


  // --------------------------------------------------
  // BAŞLAT
  // --------------------------------------------------

  loadProject();

</script>

</body>
</html>
