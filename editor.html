<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ozan Builder - Editör</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #111827;
    }

    header {
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
    }

    .logo span {
      color: #635bff;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .back {
      background: #eef0f4;
      color: #111827;
    }

    .save {
      background: #635bff;
      color: white;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 64px);
    }

    .sidebar {
      background: white;
      border-right: 1px solid #e5e7eb;
      padding: 20px;
    }

    .sidebar h3 {
      margin: 0 0 18px;
    }

    .tool {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      margin-bottom: 10px;
      text-align: left;
      padding: 13px;
      border-radius: 9px;
      cursor: pointer;
    }

    .tool:hover {
      background: #eef2ff;
      border-color: #c7d2fe;
    }

    .workspace {
      padding: 25px;
      overflow: auto;
    }

    .project-title {
      margin-bottom: 18px;
    }

    .project-title h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .project-title p {
      margin: 0;
      color: #6b7280;
    }

    .canvas {
      max-width: 1000px;
      min-height: 600px;
      margin: auto;
      background: white;
      border: 1px solid #dfe3e8;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.05);
      padding: 40px;
    }

    .canvas-empty {
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #d1d5db;
      border-radius: 10px;
      color: #9ca3af;
      text-align: center;
    }

    .element {
      position: relative;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .element:hover {
      border: 1px dashed #635bff;
    }

    .element.selected {
      border: 2px solid #635bff;
    }

    .element h1 {
      font-size: 38px;
      margin: 0 0 10px;
    }

    .element p {
      color: #6b7280;
      line-height: 1.6;
      font-size: 17px;
    }

    .element img {
      max-width: 100%;
      border-radius: 10px;
    }

    .empty-message {
      text-align: center;
      color: #9ca3af;
    }

    @media (max-width: 800px) {

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid #e5e7eb;
      }

      .canvas {
        padding: 20px;
      }

    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    Ozan <span>Builder</span>
  </div>

  <div class="header-actions">

    <button
      class="back"
      onclick="goHome()"
    >
      ← Projeler
    </button>

    <button
      class="save"
      onclick="saveSite()"
    >
      Kaydet
    </button>

  </div>

</header>


<div class="layout">

  <aside class="sidebar">

    <h3>
      Elemanlar
    </h3>

    <button
      class="tool"
      onclick="addHeading()"
    >
      ➕ Başlık ekle
    </button>

    <button
      class="tool"
      onclick="addText()"
    >
      📝 Metin ekle
    </button>

    <button
      class="tool"
      onclick="addImage()"
    >
      🖼️ Görsel ekle
    </button>

    <button
      class="tool"
      onclick="addButton()"
    >
      🔘 Buton ekle
    </button>

  </aside>


  <main class="workspace">

    <div class="project-title">

      <h1 id="projectName">
        Proje
      </h1>

      <p id="projectDescription">
        Web siteni burada tasarlayabilirsin.
      </p>

    </div>


    <div class="canvas">

      <div
        id="canvasContent"
        class="canvas-empty"
      >

        <div>

          <h2>
            Web siteni oluşturmaya başla
          </h2>

          <p>
            Soldaki araçlardan bir eleman ekle.
          </p>

        </div>

      </div>

    </div>

  </main>

</div>


<script src="js/projects.js"></script>

<script>

  var currentProject = null;

  var canvas =
    document.getElementById("canvasContent");


  function loadProject() {

    currentProject =
      ProjectManager.getCurrentProject();


    if (!currentProject) {

      document.getElementById(
        "projectName"
      ).textContent = "Proje bulunamadı";

      return;

    }


    document.getElementById(
      "projectName"
    ).textContent =
      currentProject.name;


    document.getElementById(
      "projectDescription"
    ).textContent =
      currentProject.description ||
      "Web siteni burada tasarlayabilirsin.";


    if (
      currentProject.elements &&
      currentProject.elements.length > 0
    ) {

      canvas.className = "";

      canvas.innerHTML = "";

      currentProject.elements.forEach(
        function(element) {

          renderElement(element);

        }
      );

    }

  }


  function addElement(type, content) {

    if (!currentProject) {
      return;
    }


    if (!currentProject.elements) {
      currentProject.elements = [];
    }


    var element = {

      id:
        Date.now().toString(),

      type:
        type,

      content:
        content

    };


    currentProject.elements.push(element);


    canvas.className = "";

    renderElement(element);

  }


  function renderElement(element) {

    var wrapper =
      document.createElement("div");

    wrapper.className = "element";

    wrapper.dataset.id =
      element.id;


    if (element.type === "heading") {

      wrapper.innerHTML =
        "<h1>" +
        escapeHTML(element.content) +
        "</h1>";

    }


    if (element.type === "text") {

      wrapper.innerHTML =
        "<p>" +
        escapeHTML(element.content) +
        "</p>";

    }


    if (element.type === "image") {

      wrapper.innerHTML =
        "<img src=\"" +
        escapeHTML(element.content) +
        "\" alt=\"Görsel\">";

    }


    if (element.type === "button") {

      wrapper.innerHTML =
        "<button>" +
        escapeHTML(element.content) +
        "</button>";

    }


    wrapper.onclick =
      function() {

        selectElement(wrapper);

      };


    canvas.appendChild(wrapper);

  }


  function selectElement(element) {

    document
      .querySelectorAll(".element")
      .forEach(function(item) {

        item.classList.remove("selected");

      });


    element.classList.add("selected");

  }


  function addHeading() {

    var text =
      prompt(
        "Başlık ne olsun?"
      );


    if (!text) {
      return;
    }


    addElement(
      "heading",
      text
    );

  }


  function addText() {

    var text =
      prompt(
        "Metin ne olsun?"
      );


    if (!text) {
      return;
    }


    addElement(
      "text",
      text
    );

  }


  function addImage() {

    var url =
      prompt(
        "Görsel URL'sini gir:"
      );


    if (!url) {
      return;
    }


    addElement(
      "image",
      url
    );

  }


  function addButton() {

    var text =
      prompt(
        "Buton üzerinde ne yazsın?"
      );


    if (!text) {
      return;
    }


    addElement(
      "button",
      text
    );

  }


  function saveSite() {

    if (!currentProject) {
      return;
    }


    ProjectManager.updateProject(
      currentProject
    );


    alert(
      "✓ Proje kaydedildi."
    );

  }


  function goHome() {

    window.location.href =
      "index.html";

  }


  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  loadProject();

</script>

</body>
</html>
